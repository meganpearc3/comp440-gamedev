<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRANDED — Interactive Survival Drama</title>
<style>
:root{
  --ink:#14171C;
  --twilight:#211530;
  --twilight-2:#2E1D45;
  --twilight-3:#3A2657;
  --ember:#E9B44C;
  --ember-dim:#B98A33;
  --lagoon:#3FB6A8;
  --coral:#E8654F;
  --sand:#F3E7D3;
  --sand-dim:#C9BBA0;
  --mist:rgba(243,231,211,0.10);
  --mist-strong:rgba(243,231,211,0.22);
  --radius:14px;
  --serif:Georgia, 'Times New Roman', serif;
  --sans:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(ellipse at 20% -10%, #3A2657 0%, transparent 55%),
    radial-gradient(ellipse at 90% 10%, #24365A 0%, transparent 45%),
    linear-gradient(180deg, var(--twilight) 0%, #180F22 100%);
  color:var(--sand);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 16px 60px;
}
::selection{background:var(--ember); color:var(--ink);}

.eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--sand-dim);
}
button{font-family:var(--sans); cursor:pointer; border:none;}
.btn{
  background:var(--ember);
  color:var(--ink);
  font-weight:700;
  padding:13px 26px;
  border-radius:999px;
  font-size:14.5px;
  letter-spacing:.01em;
  transition:transform .15s ease, box-shadow .15s ease;
  box-shadow:0 6px 18px rgba(233,180,76,0.18);
}
.btn:hover{transform:translateY(-2px); box-shadow:0 10px 26px rgba(233,180,76,0.28);}
.btn:active{transform:translateY(0);}
.btn.ghost{
  background:transparent;
  color:var(--sand);
  border:1px solid var(--mist-strong);
  box-shadow:none;
}
.btn.ghost:hover{background:var(--mist); transform:translateY(-2px);}

#app{width:100%; max-width:1180px;}

/* ---------- Portraits ---------- */
.portrait{display:inline-block; border-radius:50%; overflow:hidden; flex-shrink:0; line-height:0;}

/* ---------- Start screen ---------- */
.start-screen{
  min-height:80vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:22px;
  padding:20px;
}
.wordmark{
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(52px,9vw,104px);
  letter-spacing:.01em;
  line-height:.95;
  background:linear-gradient(180deg,#FCEFD2 0%, var(--ember) 60%, var(--ember-dim) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.tagline{
  font-family:var(--serif);
  font-style:italic;
  font-size:clamp(15px,2.2vw,19px);
  color:var(--sand-dim);
  max-width:520px;
}
.start-blurb{
  max-width:560px;
  font-size:14.5px;
  line-height:1.7;
  color:var(--sand-dim);
}
.cast-preview{
  display:flex; flex-wrap:wrap; justify-content:center; gap:12px; max-width:600px; margin-top:6px;
}
.cast-preview-item{display:flex; flex-direction:column; align-items:center; gap:6px;}
.cast-preview-item span{font-family:var(--mono); font-size:10px; color:var(--sand-dim);}

.demo-badge{
  font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--lagoon); border:1px solid rgba(63,182,168,.28); background:rgba(63,182,168,.07);
  padding:7px 11px; border-radius:999px;
}
.how-to-play{
  width:min(720px,96vw); display:grid; grid-template-columns:repeat(4,1fr); gap:9px;
  background:rgba(13,9,20,.34); border:1px solid var(--mist-strong); border-radius:16px; padding:12px;
}
.how-card{background:rgba(243,231,211,.045);border:1px solid var(--mist);border-radius:12px;padding:12px;text-align:left;min-height:92px}
.how-num{font-family:var(--mono);font-size:10px;color:var(--ember);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.how-title{font-family:var(--serif);font-size:14px;font-weight:700;margin-bottom:4px}
.how-text{font-size:11.5px;line-height:1.45;color:var(--sand-dim)}
.demo-meta{font-family:var(--mono);font-size:10px;color:var(--sand-dim);letter-spacing:.04em}
@media(max-width:680px){.how-to-play{grid-template-columns:1fr 1fr}.how-card{min-height:0}}
@media(max-width:430px){.how-to-play{grid-template-columns:1fr}}

/* ---------- Day/Time arc ---------- */
.arc-wrap{ width:100%; max-width:520px; margin:0 auto 10px; }
.arc-label{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.day-title{font-family:var(--serif); font-weight:700; font-size:22px; color:var(--sand);}
.arc-svg{width:100%; height:44px; display:block;}
.arc-path{stroke:var(--mist-strong); stroke-width:1.5; fill:none; stroke-dasharray:2 6; stroke-linecap:round;}
.arc-node{fill:var(--twilight-2); stroke:var(--mist-strong); stroke-width:1.5;}
.arc-node.active{fill:var(--ember); stroke:var(--ember);}
.arc-node.done{fill:var(--lagoon); stroke:var(--lagoon);}
.arc-node-label{font-family:var(--mono); font-size:9px; fill:var(--sand-dim); text-transform:uppercase; letter-spacing:.06em;}
.arc-node-label.active{fill:var(--ember);}

/* ---------- Layout ---------- */
.game-shell{ display:grid; grid-template-columns:250px 1fr; gap:22px; align-items:start; }
@media (max-width:860px){ .game-shell{grid-template-columns:1fr;} }

/* ---------- Cast sidebar ---------- */
.cast-panel{
  background:linear-gradient(180deg, var(--twilight-2), var(--twilight-3));
  border:1px solid var(--mist-strong);
  border-radius:var(--radius);
  padding:16px;
  position:sticky; top:20px;
}
.cast-panel h3{ font-family:var(--serif); font-size:15px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.cast-list{display:flex; flex-direction:column; gap:6px;}
.cast-chip{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; background:transparent; transition:background .15s ease; width:100%; text-align:left; }
.cast-chip:hover{background:var(--mist);}
.cast-chip .name{font-size:13.5px; font-weight:600; color:var(--sand);}
.cast-chip .role{font-size:11px; color:var(--sand-dim); font-family:var(--mono);}
.cast-chip .bar-mini{ width:100%; height:3px; background:rgba(255,255,255,0.08); border-radius:2px; margin-top:4px; overflow:hidden; }
.cast-chip .bar-mini-fill{height:100%; border-radius:2px;}
.cast-chip .chip-text{flex:1; min-width:0;}

.journal-toggle{
  margin-top:14px; width:100%;
  font-family:var(--mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--sand-dim); background:transparent; border:1px dashed var(--mist-strong);
  padding:10px; border-radius:10px;
}
.journal-toggle:hover{color:var(--ember); border-color:var(--ember-dim);}

/* ---------- Scene panel ---------- */
.scene-panel{
  background:linear-gradient(160deg, rgba(46,29,69,0.9), rgba(33,21,48,0.95));
  border:1px solid var(--mist-strong);
  border-radius:var(--radius);
  padding:30px;
  min-height:420px;
  display:flex; flex-direction:column;
  position:relative;
  overflow:hidden;
}
.scene-panel::before{
  content:'';
  position:absolute; inset:0;
  background:radial-gradient(circle at 85% -10%, rgba(63,182,168,0.12), transparent 50%);
  pointer-events:none;
}
.scene-title{ font-family:var(--serif); font-weight:700; font-size:clamp(21px,3vw,27px); margin-bottom:14px; color:var(--sand); }
.scene-meta{font-family:var(--mono); font-size:11px; color:var(--lagoon); text-transform:uppercase; letter-spacing:.1em; margin-bottom:6px;}

.portrait-row{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; min-height:56px; align-items:center; }
.portrait-row .portrait{border:2px solid var(--mist-strong);}

.narration-text{
  font-family:var(--serif); font-style:italic; font-weight:500;
  font-size:15.5px; line-height:1.6; color:var(--sand-dim); margin-bottom:16px;
  min-height:24px;
}
.narration-text.loading{color:var(--sand-dim);}
.dots::after{content:'…'; animation:dotpulse 1.4s infinite;}
@keyframes dotpulse{0%,100%{opacity:.3;} 50%{opacity:1;}}

.dialogue-list{display:flex; flex-direction:column; gap:10px; margin-bottom:6px;}
.dialogue-row{display:flex; gap:10px; align-items:flex-start;}
.dialogue-bubble{
  background:rgba(243,231,211,0.05); border:1px solid var(--mist-strong);
  border-radius:4px 14px 14px 14px; padding:9px 14px; max-width:460px;
}
.dialogue-speaker{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--lagoon); margin-bottom:3px;}
.dialogue-line{font-size:14.5px; line-height:1.5; color:#EDE2CE;}

.choices{ margin-top:22px; display:flex; flex-direction:column; gap:10px; }
.choice-btn{
  background:rgba(243,231,211,0.04); border:1px solid var(--mist-strong); color:var(--sand);
  text-align:left; padding:15px 18px; border-radius:12px; font-size:14.5px; line-height:1.5;
  display:flex; gap:12px; align-items:flex-start;
  transition:border-color .15s ease, background .15s ease, transform .1s ease;
}
.choice-btn:hover{border-color:var(--ember); background:rgba(233,180,76,0.08); transform:translateX(3px);}
.choice-letter{font-family:var(--mono); font-weight:600; color:var(--ember); flex-shrink:0; padding-top:1px;}
.choice-btn:disabled{opacity:.4; cursor:default; transform:none;}


/* ---------- Illustrated scene stage ---------- */
.scene-art{
  position:relative; height:190px; margin:-8px -8px 22px; border-radius:13px;
  overflow:hidden; border:1px solid rgba(243,231,211,.14);
  background:#10131d; box-shadow:inset 0 -30px 55px rgba(7,5,12,.45);
}
.scene-art svg{width:100%;height:100%;display:block;}
.scene-art::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg,transparent 52%,rgba(12,8,18,.35));
  mix-blend-mode:multiply;
}
.scene-art .drift{animation:drift 9s ease-in-out infinite alternate; transform-origin:center;}
.scene-art .flicker{animation:flicker 2.2s ease-in-out infinite; transform-origin:center;}
.scene-art .pulse{animation:eeriePulse 3.2s ease-in-out infinite;}
.scene-art .sway{animation:sway 5s ease-in-out infinite alternate; transform-origin:bottom center;}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(7px)}}
@keyframes flicker{0%,100%{opacity:.55;transform:scale(.96)}35%{opacity:1;transform:scale(1.05)}70%{opacity:.72;transform:scale(.99)}}
@keyframes eeriePulse{0%,100%{opacity:.15}50%{opacity:.7}}
@keyframes sway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}

.eerie-whisper{
  position:absolute; right:18px; bottom:13px; z-index:3; font-family:var(--mono);
  font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:rgba(243,231,211,.52);
  text-shadow:0 1px 8px rgba(0,0,0,.8); opacity:.8;
}
.scene-panel.eerie{box-shadow:0 0 0 1px rgba(142,124,195,.12), 0 20px 60px rgba(0,0,0,.35);}
.scene-panel.eerie::before{background:radial-gradient(circle at 85% -10%, rgba(142,124,195,.18), transparent 48%);}

.mystery-strip{
  display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px;
}
.mystery-chip{
  font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
  padding:6px 8px; border-radius:999px; border:1px solid rgba(142,124,195,.28);
  color:#C9BDEB; background:rgba(142,124,195,.08);
}
.glitch-note{
  margin:12px 0 0; padding:10px 12px; border-left:2px solid #8E7CC3;
  background:rgba(142,124,195,.07); font-family:var(--mono); font-size:10.5px;
  letter-spacing:.05em; color:#D8D0ED;
}

@media (max-width:520px){.scene-art{height:150px;margin:-2px -2px 18px;}}



/* ============================= LIVE ISLAND SOCIAL MAP ============================= */
.world-panel{
  margin-bottom:18px;
  background:linear-gradient(160deg,rgba(24,35,53,.96),rgba(24,15,34,.98));
  border:1px solid var(--mist-strong); border-radius:18px; overflow:hidden;
  box-shadow:0 16px 40px rgba(0,0,0,.24);
}
.world-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:17px 18px 12px;}
.world-title{font-family:var(--serif);font-size:20px;font-weight:700;}
.world-sub{font-size:11.5px;color:var(--sand-dim);margin-top:3px;line-height:1.45;}
.live-pill{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#c9fff3;border:1px solid rgba(63,182,168,.35);background:rgba(63,182,168,.09);padding:6px 9px;border-radius:999px;white-space:nowrap;}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lagoon);margin-right:6px;box-shadow:0 0 0 0 rgba(63,182,168,.6);animation:livePulse 1.8s infinite;}
@keyframes livePulse{60%{box-shadow:0 0 0 7px rgba(63,182,168,0)}100%{box-shadow:0 0 0 0 rgba(63,182,168,0)}}

.island-map{
  position:relative;height:390px;margin:0 14px 14px;border-radius:18px;overflow:hidden;
  border:1px solid rgba(243,231,211,.13);
  background:
    radial-gradient(ellipse at 49% 51%,#7a8750 0 15%,#53683e 16% 31%,#3d5939 32% 43%,transparent 44%),
    radial-gradient(ellipse at 48% 52%,#e4c98c 0 47%,transparent 48%),
    radial-gradient(ellipse at 50% 50%,#4aa6a1 0 55%,#276777 70%,#193d59 100%);
  isolation:isolate;
}
.island-map::before{content:'';position:absolute;inset:-20%;background:repeating-radial-gradient(ellipse at center,transparent 0 16px,rgba(255,255,255,.035) 18px 19px,transparent 21px 30px);opacity:.8;animation:waterMove 12s linear infinite;z-index:-1;}
.island-map::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 28% 18%,rgba(255,222,153,.20),transparent 25%),linear-gradient(180deg,transparent 45%,rgba(9,18,30,.18));z-index:30;}
.island-map.night{filter:saturate(.78) brightness(.74);box-shadow:inset 0 0 80px rgba(18,7,32,.48);}
.island-map.storm{animation:mapStorm 4s ease-in-out infinite;}
@keyframes waterMove{to{transform:rotate(2deg) scale(1.03)}}
@keyframes mapStorm{0%,92%,100%{filter:brightness(.76)}94%{filter:brightness(1.22)}96%{filter:brightness(.66)}98%{filter:brightness(1.05)}}

.map-path{position:absolute;border:1px dashed rgba(240,226,195,.22);border-radius:50%;pointer-events:none;z-index:1;}
.map-path.p1{left:28%;top:26%;width:45%;height:50%;transform:rotate(-13deg)}
.map-path.p2{left:38%;top:17%;width:27%;height:65%;transform:rotate(28deg)}
.location-hotspot{position:absolute;transform:translate(-50%,-50%);z-index:5;background:rgba(25,20,29,.64);border:1px solid rgba(243,231,211,.20);border-radius:12px;padding:6px 8px;color:var(--sand);backdrop-filter:blur(4px);box-shadow:0 4px 12px rgba(0,0,0,.20);transition:.18s ease;}
.location-hotspot:hover{border-color:var(--ember);background:rgba(33,21,48,.84);transform:translate(-50%,-50%) translateY(-2px)}
.loc-icon{font-size:15px;line-height:1;display:block}.loc-name{display:block;font-family:var(--mono);font-size:8px;text-transform:uppercase;letter-spacing:.06em;margin-top:3px;white-space:nowrap;color:#f4e8d2}
.location-hotspot.mystery{border-color:rgba(142,124,195,.48);box-shadow:0 0 18px rgba(142,124,195,.16)}
.location-hotspot.locked{opacity:.34;filter:grayscale(.5)}

.map-avatar{position:absolute;width:42px;height:50px;transform:translate(-50%,-50%);z-index:18;transition:left 2.25s cubic-bezier(.3,.8,.25,1),top 2.25s cubic-bezier(.3,.8,.25,1),transform .15s ease;cursor:pointer;text-align:center;filter:drop-shadow(0 5px 6px rgba(0,0,0,.32));}
.map-avatar:hover{transform:translate(-50%,-50%) scale(1.12);z-index:25}.map-avatar .portrait{background:rgba(20,16,28,.45);border:2px solid rgba(255,255,255,.42)}
.map-avatar-name{font-family:var(--mono);font-size:7.5px;background:rgba(17,12,22,.76);padding:2px 5px;border-radius:999px;display:inline-block;margin-top:1px;color:#fff;white-space:nowrap;}
.map-avatar.walking .portrait{animation:walkBob .45s ease-in-out infinite alternate}@keyframes walkBob{to{transform:translateY(-3px) rotate(1deg)}}


.map-bottom{display:grid;grid-template-columns:1.15fr .85fr;gap:10px;padding:0 14px 14px;}
.observe-card,.social-feed{border:1px solid var(--mist);background:rgba(243,231,211,.035);border-radius:12px;padding:11px 12px;min-height:78px;}
.observe-title,.feed-title{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--lagoon);margin-bottom:5px;}
.observe-text{font-size:12px;line-height:1.5;color:var(--sand-dim)}
.feed-line{font-size:11px;line-height:1.45;color:var(--sand-dim);padding:3px 0;border-bottom:1px solid rgba(243,231,211,.05)}.feed-line:last-child{border:0}
.world-actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px;}
.map-btn{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--mist-strong);background:rgba(243,231,211,.04);color:var(--sand-dim);border-radius:999px;padding:7px 10px}.map-btn:hover{border-color:var(--ember);color:var(--ember)}
@media(max-width:680px){.island-map{height:330px}.map-bottom{grid-template-columns:1fr}.location-hotspot{padding:5px}.loc-name{display:none}.world-head{align-items:flex-start}.map-avatar{width:36px}.map-avatar .portrait{transform:scale(.88)}}

/* ---------- Toasts ---------- */
#toast-stack{ position:fixed; bottom:20px; right:20px; z-index:60; display:flex; flex-direction:column; gap:8px; align-items:flex-end; max-width:280px; }
.toast{
  font-family:var(--serif); font-style:italic; font-size:13.5px;
  background:var(--twilight-3); border:1px solid var(--mist-strong);
  color:var(--sand); padding:10px 16px; border-radius:10px 10px 2px 10px;
  box-shadow:0 8px 22px rgba(0,0,0,0.35);
  animation:toastIn .3s ease, toastOut .3s ease 3.4s forwards;
}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@keyframes toastOut{to{opacity:0; transform:translateY(-6px);}}

/* ---------- Modal ---------- */
.modal-backdrop{ position:fixed; inset:0; background:rgba(10,6,16,0.65); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:80; padding:20px; }
.modal{ background:var(--twilight-2); border:1px solid var(--mist-strong); border-radius:16px; max-width:420px; width:100%; padding:26px; }
.modal-head{display:flex; gap:14px; align-items:center; margin-bottom:16px;}
.modal-head .name{font-family:var(--serif); font-weight:700; font-size:20px;}
.modal-head .role{font-family:var(--mono); font-size:11px; color:var(--sand-dim); text-transform:uppercase; letter-spacing:.06em;}
.stat-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
.stat-label{width:92px; font-size:11.5px; color:var(--sand-dim); font-family:var(--mono); flex-shrink:0;}
.stat-track{flex:1; height:6px; background:rgba(255,255,255,0.07); border-radius:4px; position:relative; overflow:hidden;}
.stat-fill{position:absolute; top:0; bottom:0; border-radius:4px;}
.modal-trait{font-size:13px; line-height:1.6; color:var(--sand-dim); margin-top:14px; padding-top:14px; border-top:1px solid var(--mist);}
.modal-close-row{margin-top:20px; text-align:right;}

/* ---------- Journal ---------- */
.journal-backdrop{position:fixed; inset:0; background:rgba(10,6,16,0.6); z-index:70; display:flex; justify-content:flex-end;}
.journal-drawer{ width:min(420px,92vw); height:100%; background:var(--twilight-2); border-left:1px solid var(--mist-strong); padding:26px; overflow-y:auto; }
.journal-entry{padding:14px 0; border-bottom:1px solid var(--mist);}
.journal-entry .jday{font-family:var(--mono); font-size:10.5px; color:var(--lagoon); text-transform:uppercase; letter-spacing:.08em;}
.journal-entry .jtext{font-size:13px; line-height:1.6; color:var(--sand-dim); margin-top:5px;}
.journal-entry .jchoice{font-size:13px; color:var(--ember); margin-top:6px; font-weight:600;}


/* ---------- Death / game over ---------- */
.death-screen{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:30px 18px}
.death-card{max-width:620px;background:linear-gradient(160deg,rgba(83,24,31,.96),rgba(24,12,20,.98));border:1px solid rgba(232,101,79,.55);border-radius:22px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.death-title{font-family:var(--serif);font-size:clamp(42px,8vw,72px);font-weight:700;color:#ffd6cf;line-height:1}
.death-reason{font-family:var(--serif);font-size:19px;line-height:1.6;margin-top:16px;color:var(--sand)}
.death-detail{font-size:13.5px;line-height:1.7;color:var(--sand-dim);margin-top:12px}

function getStoryChallenge(key){
  const base=STORY_CHALLENGES[key];
  if(!base) return null;
  // This challenge only happens if the player actually promised Ama.
  if(key==='d1-afternoon' && !state.flags.promised_ama_exploration) return null;
  if(key==='d2-afternoon'){
    if(state.flags.sided_priya) return {...base,title:'Fortify Camp',desc:'Priya puts you in charge of reinforcing the weakest parts of camp. Choose the safest order before the wind picks up.'};
    if(state.flags.proposed_compromise) return {...base,title:'Split Duties',desc:'Your compromise only works if you can coordinate the ridge team and camp team. Choose the route that keeps both groups covered.'};
    return {...base,title:'Ridge Run',desc:'Malik trusts you to help lead the ridge team. Choose the safest route before the light fades.'};
  }
  if(key==='d2-night'){
    if(state.flags.kept_plate_secret) return {...base,title:'Secret Plate Decode',desc:'Only you and Dez know about the plate. Find the three details that could explain the symbol without alerting camp.'};
    if(state.flags.ama_has_plate) return {...base,title:'Decode It With Ama',desc:'Ama starts spotting patterns immediately. Help her identify the three details that matter most.'};
    return {...base,title:'Group Evidence Check',desc:'Everyone has an opinion about the plate. Find the three concrete details before the argument takes over.'};
  }
  return base;
}

/* ============================= PORTRAITS ============================= */
function composite(state, id){
  const s = state.stats[id];
  let v = 0;
  for(const k of POSITIVE_STATS) v += s[k];
  for(const k of NEGATIVE_STATS) v -= s[k];
  return v;
}

function drawPortrait(id, size){
  const c = CHARS[id];
  const v = CHAR_VISUALS[id];
  const comp = (typeof state !== 'undefined' && state) ? composite(state, id) : 0;
  const mood = comp > 60 ? 'happy' : comp < -60 ? 'upset' : 'neutral';
  const mouth = mood==='happy' ? 'M36,68 Q50,79 64,68' : mood==='upset' ? 'M36,74 Q50,63 64,74' : 'M38,70 L62,70';
  const browL = mood==='upset' ? 'M28,45 L42,50' : mood==='happy' ? 'M28,49 L42,46' : 'M28,47 L42,47';
  const browR = mood==='upset' ? 'M72,45 L58,50' : mood==='happy' ? 'M72,49 L58,46' : 'M72,47 L58,47';

  let hairBack = '', extra = '';
  switch(id){
    case 'nia':
      hairBack = `<circle cx="50" cy="46" r="33" fill="${v.hair}"/>`;
      break;
    case 'malik':
      hairBack = `<path d="M20,44 Q50,14 80,44 L80,36 Q50,10 20,36 Z" fill="${v.hair}"/>`;
      break;
    case 'simone':
      hairBack = `<path d="M18,52 Q16,16 50,16 Q84,16 82,52 L82,70 Q70,60 70,50 Q70,32 50,32 Q30,32 30,50 Q30,60 18,70 Z" fill="${v.hair}"/>`;
      break;
    case 'julian':
      hairBack = `<path d="M18,46 Q50,10 82,46 L82,32 Q50,2 18,32 Z" fill="${c.color}"/><path d="M18,44 L25,53 L17,52 Z" fill="${v.hair}"/><path d="M82,44 L75,53 L83,52 Z" fill="${v.hair}"/>`;
      break;
    case 'ama':
      hairBack = `<path d="M20,42 Q50,12 80,42 L80,34 Q50,8 20,34 Z" fill="${v.hair}"/>
        <rect x="13" y="40" width="6" height="34" rx="3" fill="${v.hair}" transform="rotate(8 16 40)"/>
        <circle cx="15" cy="76" r="3.5" fill="${c.color}"/>
        <rect x="81" y="40" width="6" height="34" rx="3" fill="${v.hair}" transform="rotate(-8 84 40)"/>
        <circle cx="85" cy="76" r="3.5" fill="${c.color}"/>`;
      extra = `<circle cx="40" cy="57" r="8" fill="none" stroke="#1A1210" stroke-width="2.5"/><circle cx="60" cy="57" r="8" fill="none" stroke="#1A1210" stroke-width="2.5"/><line x1="48" y1="57" x2="52" y2="57" stroke="#1A1210" stroke-width="2.5"/>`;
      break;
    case 'priya':
      hairBack = `<path d="M16,50 Q14,14 50,14 Q86,14 84,50 Q90,80 78,94 Q76,60 68,50 Q68,30 50,30 Q32,30 32,50 Q24,60 22,94 Q10,80 16,50 Z" fill="${v.hair}"/>`;
      extra = `<ellipse cx="42" cy="23" rx="9" ry="5" fill="${v.hair2}" opacity="0.9"/><ellipse cx="58" cy="23" rx="9" ry="5" fill="${v.hair2}" opacity="0.9"/><rect x="49" y="21" width="4" height="4" fill="${v.hair2}" opacity="0.9"/>`;
      break;
    case 'dez':
      hairBack = `<path d="M22,44 Q50,18 78,44 L78,36 Q50,14 22,36 Z" fill="${v.hair}"/>`;
      extra = `<path d="M32,66 Q50,90 68,66 Q68,80 50,84 Q32,80 32,66 Z" fill="${v.hair}"/>`;
      break;
  }

  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" style="display:block;">

    <path d="${mouth}" stroke="#3A241A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    ${extra}
  </svg>`;
}
function portraitHTML(id, size, withBorder){
  return `<span class="portrait" style="width:${size}px;height:${size}px;${withBorder?'border:2px solid var(--mist-strong);':''}">${drawPortrait(id,size)}</span>`;

function lowestComposite(state, exclude=[]){
  let best=null, bestScore=Infinity;
  for(const id of CHAR_ORDER){
    if(exclude.includes(id)) continue;
    const c = composite(state, id);
    if(c < bestScore){ bestScore=c; best=id; }
  }
  return best;
}

/* ============================= STATE ============================= */
let state = null;
function initState(){
  const stats = {};
  for(const id of CHAR_ORDER){
    stats[id] = {trust:0,loyalty:0,respect:0,affection:0,suspicion:0,resentment:0,jealousy:0,fear:0};
  }
  stats.dez.trust = -15; stats.dez.suspicion = 10;
  stats.priya.jealousy = 8;
  return {
    stats,
    flags:{},
    survival:{food:2,water:2,shelter:1,signal:0},
    tagCounts:{leader:0,diplomat:0,strategist:0,protector:0,peacemaker:0,wildcard:0,loneWolf:0},
    seqIndex:-1,
    journal:[],
    mapLocations:{...MAP_START},
    socialRelations:{},
    socialLog:[],
    mapTick:0,
    observedLocation:'camp',
    _d3target:null,
    _lastScene:null,
    minigames:{played:0,wins:0,scores:{}},
    tension:20,
    fights:{won:0,lost:0,stopped:0},
    alive:true,
    deathReason:null,
    deathDetail:null,
    started:false
  };
}

function clamp(v){ return Math.max(-100, Math.min(100, v)); }

function changeTension(delta){
  if(!state) return;
  state.tension=Math.max(0,Math.min(100,(state.tension||0)+delta));
}
function tensionLabel(){
  const t=state?.tension||0;
  return t>=70?'volatile':t>=45?'heated':t>=25?'uneasy':'steady';
}
function clampSurvival(v){ return Math.max(0, Math.min(5, v)); }
function applySurvival(changes){
  if(!changes) return;
  for(const k of Object.keys(changes)) state.survival[k]=clampSurvival((state.survival[k]||0)+changes[k]);
}
function survivalHUD(){
  const labels={food:'🥫 Food',water:'💧 Water',shelter:'⛺ Shelter',signal:'📡 Signal'};
  return `<div class="survival-hud">${Object.keys(labels).map(k=>{const v=state.survival[k]||0;return `<span class="survival-pill ${v<=1?'low':v>=3?'good':''}">${labels[k]} <strong>${v}/5</strong></span>`}).join('')}</div>`;
}

function applyEffects(effectsRaw){
  let effects = typeof effectsRaw === 'function' ? effectsRaw(state) : effectsRaw;
  if(!effects) return;
  const changedChars = {};
  for(const key of Object.keys(effects)){
    const deltas = effects[key];
    const targets = key === 'all' ? CHAR_ORDER : [key];
    for(const id of targets){
      let net = 0;
      for(const stat of Object.keys(deltas)){
        state.stats[id][stat] = clamp(state.stats[id][stat] + deltas[stat]);
        net += deltas[stat] * (NEGATIVE_STATS.includes(stat) ? -1 : 1);
      }
      changedChars[id] = (changedChars[id]||0) + net;
    }
  }
  for(const id of Object.keys(changedChars)){
    const net = changedChars[id];
    if(Math.abs(net) >= 8) showToast(toastPhrase(id, net));
  }
}

function toastPhrase(id, net){
  const name = CHARS[id].name.split(' ')[0];
  const positivePhrases = [`${name} appreciated that.`, `${name} will remember this.`, `${name} seems to trust you a little more.`];
  const negativePhrases = [`${name} will remember this.`, `${name} seems suspicious of you.`, `Something shifted between you and ${name}.`];
  const arr = net >= 0 ? positivePhrases : negativePhrases;
  return arr[Math.floor(Math.random()*arr.length)];
}

function showToast(msg){
  const stack = document.getElementById('toast-stack');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>el.remove(), 3900);
}

function relationshipAside(id){
  if(!id || !state || !state.stats[id]) return null;
  const score=composite(state,id);
  if(score>90) return `${CHARS[id].name.split(' ')[0]} stays close to you without being asked.`;
  if(score<-90) return `${CHARS[id].name.split(' ')[0]} keeps a careful distance from you.`;
  return null;
}

async function generateSceneText(eventDef, extraContext){
  const opening = !eventDef.title;
  if(opening){
    return {
      narration:'You wake on warm sand with your ears ringing. Seven strangers stir nearby, while a trail of wet footprints leads from the ocean straight into the trees.',
      dialogue:[
        {speaker:'ama',line:'Okay... nobody else walked out of the ocean, right?'},
        {speaker:'malik',line:'Everybody count heads. Right now.'}
      ]
    };
  }
  let narration = eventDef.beat || 'The island goes strangely quiet around you.';
  const aside=(eventDef.involved||[]).map(relationshipAside).find(Boolean);
  if(aside && narration.length<280) narration += ` ${aside}`;
  let dialogue=(LOCAL_SCENES[eventDef.title]||[]).filter(d=>(eventDef.involved||[]).length===0 || (eventDef.involved||[]).includes(d.speaker));
  if(eventDef.title==='Quiet Confrontation' && state._d3target){
    dialogue=[{speaker:state._d3target,line:'I needed you to notice before I had to ask.'}];
  }
  return {narration, dialogue:dialogue.slice(0,2)};
}

async function generateEndingText(archetypeKey, closestAlly, biggestRival){
  const ally=CHARS[closestAlly].name.split(' ')[0];
  const rival=CHARS[biggestRival].name.split(' ')[0];
  const survivalTotal=Object.values(state.survival||{}).reduce((a,b)=>a+b,0);
  const fightLine=state.fights.lost===0 && state.fights.won>0
    ? `You kept ${state.fights.won} major confrontation${state.fights.won===1?'':'s'} from destroying the camp.`
    : state.fights.lost>0
      ? `${state.fights.lost} confrontation${state.fights.lost===1?'':'s'} got out of control, and the camp paid for it in supplies and trust.`
      : 'The camp never fully exploded into a major fight.';
  const groupLine=state.tension>=70
    ? 'By rescue, the group is barely functioning as one unit.'
    : state.tension>=45
      ? 'The group makes it to rescue, but several arguments are still one bad sentence away from another fight.'
      : 'The group is exhausted, but it is still functioning as a team when rescue reaches shore.';
  const rescueLine=(state.flags.signal_fire_success && survivalTotal>=8)
    ? 'Your signal is strong enough that the ship turns directly toward the beach.'
    : survivalTotal<6
      ? 'Low supplies and a weak signal delay the rescue approach, forcing everyone to hold the beach longer.'
      : 'The signal is rough, but the ship eventually commits to shore.';
  return `${groupLine} ${fightLine} ${ally} is still willing to work beside you. ${rival} keeps their distance. ${rescueLine} Then, just as everyone starts to believe it is over, a crew member reaches down from the rescue boat wearing the same looping symbol found on the island.`;
}

    else if(state.flags.revealed_plate_group) extra = "Half the camp wants the concrete stairwell opened and half wants it left alone. The argument ends when the lock clicks by itself.";
    else extra = "The storm exposes a concrete stairwell. Inside, the same looping symbol appears on a dead monitor before it flickers on.";
    const evidenceEcho = state.flags.tidepool_clues ? ' Ama pulls out the machine screw and marked shell you found together at the tidepools; both match hardware and symbols in the room.' : state.flags.plate_clues_found ? ' The initials, P-04 code, and symbol you identified on the plate appear again inside the room.' : '';
    def.beat = `${extra}${evidenceEcho} Below ground is a dusty observation room with eight labeled folders, a live map of your camp, and a photograph of all eight of you asleep on the beach — taken from the ridge after the crash. On the back: PHASE FOUR.`;
    return def;
  }
  return EVENTS[key];
}

function currentDayNumber(){
  const key = SEQUENCE[state.seqIndex];
  if(!key) return 1;
  return parseInt(key.split('-')[0].replace('d',''));
}
function currentSlot(){
  const key = SEQUENCE[state.seqIndex];
  if(!key) return 'morning';
  return key.split('-')[1];
}

function currentMysteryChips(){

function isRuinsUnlocked(){

}

}
function renderIslandMap(){

function mapJitter(id, loc){
  const same=CHAR_ORDER.filter(c=>state.mapLocations[c]===loc);
  const idx=Math.max(0,same.indexOf(id));
  const offsets=[[-3,-1],[3,1],[-1,4],[4,-4],[-5,4],[6,3],[1,-6]];
  return offsets[idx%offsets.length];
}
function renderMapAvatars(animated=false){
  const layer=document.getElementById('map-avatars'); if(!layer) return;
  layer.innerHTML=CHAR_ORDER.map(id=>{
    const loc=state.mapLocations[id]||'camp', l=ISLAND_LOCATIONS[loc]||ISLAND_LOCATIONS.camp, j=mapJitter(id,loc);
    return `<button class="map-avatar ${animated?'walking':''}" data-map-char="${id}" style="left:${l.x+j[0]}%;top:${l.y+j[1]}%" aria-label="${CHARS[id].name} at ${l.name}">${portraitHTML(id,34,false)}<span class="map-avatar-name">${CHARS[id].name.split(' ')[0]}</span></button>`;
  }).join('');

}
function relationKey(a,b){return [a,b].sort().join('|')}
function pairRelation(a,b){return state.socialRelations[relationKey(a,b)]||0}
function changePairRelation(a,b,delta){const k=relationKey(a,b);state.socialRelations[k]=Math.max(-30,Math.min(30,(state.socialRelations[k]||0)+delta));}
function peopleAt(loc){return CHAR_ORDER.filter(id=>state.mapLocations[id]===loc)}
function fmtLine(line,a,b){return line.replace('{a}',CHARS[a].name.split(' ')[0]).replace('{b}',CHARS[b].name.split(' ')[0])}
function addSocialLog(text,kind='neutral'){
  state.socialLog.unshift({text,kind,day:currentDayNumber(),slot:currentSlot()}); state.socialLog=state.socialLog.slice(0,5); renderSocialFeed();
}
function renderSocialFeed(){
  const el=document.getElementById('social-feed-lines'); if(!el) return;
  el.innerHTML=(state.socialLog.length?state.socialLog:[{text:'Everyone is still feeling each other out.'}]).slice(0,3).map(x=>`<div class="feed-line">${x.text}</div>`).join('');
}
function chooseSocialMoment(a,b,loc){
  const rel=pairRelation(a,b); const eerieChance=(currentSlot()==='night'?0.23:0.07)+(loc==='jungle'||loc==='ruins'?0.18:0);
  let bucket;
  if(Math.random()<eerieChance) bucket='eerie';
  else if(rel<=-7 || Math.random() < (state.stats[a].resentment+state.stats[b].resentment+20)/260) bucket='drama';
  else if(rel>=6) bucket='friendly';
  else bucket=Math.random()<.48?'friendly':'neutral';
  const arr=SOCIAL_LINES[bucket], pick=arr[Math.floor(Math.random()*arr.length)], line=fmtLine(pick[1],a,b);
  if(bucket==='friendly') changePairRelation(a,b,2+Math.floor(Math.random()*3));
  if(bucket==='drama') changePairRelation(a,b,-3-Math.floor(Math.random()*3));
  if(bucket==='neutral') changePairRelation(a,b,Math.random()<.55?1:0);
  addSocialLog(line,bucket);
  observeLocation(loc,line);
}
function moveCharacter(id,target){
  if(target==='ruins'&&!isRuinsUnlocked()) target='jungle';
  state.mapLocations[id]=target;
}
function socialTick(forceInteraction=false){
  if(!state||!state.started||state.seqIndex>=SEQUENCE.length)return;
  state.mapTick++;
  const movers=[...CHAR_ORDER].sort(()=>Math.random()-.5).slice(0,2+(Math.random()<.35?1:0));
  movers.forEach(id=>{
    const here=state.mapLocations[id]||'camp'; let options=(MAP_NEIGHBORS[here]||['camp']).filter(x=>x!=='ruins'||isRuinsUnlocked());
    if(Math.random()<.58){
      const occupied=options.filter(o=>peopleAt(o).length>0); if(occupied.length) options=occupied;
    }
    if(options.length) moveCharacter(id,options[Math.floor(Math.random()*options.length)]);
  });
  renderMapAvatars(true);
  const groups=Object.keys(ISLAND_LOCATIONS).map(loc=>[loc,peopleAt(loc)]).filter(x=>x[1].length>=2);
  if(groups.length && (forceInteraction||Math.random()<.82)){
    const [loc,people]=groups[Math.floor(Math.random()*groups.length)]; const shuffled=[...people].sort(()=>Math.random()-.5); chooseSocialMoment(shuffled[0],shuffled[1],loc);
  }else if(Math.random()<.32){
    const id=CHAR_ORDER[Math.floor(Math.random()*CHAR_ORDER.length)],loc=state.mapLocations[id];
    const solo=[`${CHARS[id].name.split(' ')[0]} keeps glancing toward the horizon.`,`${CHARS[id].name.split(' ')[0]} disappears behind the trees for a minute, then comes back without explaining.`,`${CHARS[id].name.split(' ')[0]} seems lost in thought.`];
    const line=solo[Math.floor(Math.random()*solo.length)];addSocialLog(line);
  }
}
function observeLocation(loc, override){
  state.observedLocation=loc; const l=ISLAND_LOCATIONS[loc],people=peopleAt(loc);
  const title=document.getElementById('observe-title'), txt=document.getElementById('observe-text'); if(!title||!txt)return;
  title.textContent=`Watching ${l.name}`;
  if(override){txt.textContent=override;return;}
  if(loc==='ruins'&&!isRuinsUnlocked()){txt.textContent='The path looks ordinary from here. For now.';return;}
  if(!people.length) txt.textContent=`Nobody is here right now. ${l.desc}`;
  else if(people.length===1) txt.textContent=`${CHARS[people[0]].name.split(' ')[0]} is here alone. ${l.desc}`;
  else txt.textContent=`${people.map(x=>CHARS[x].name.split(' ')[0]).join(', ')} are here together. That could stay peaceful. Could.`;
}
function observeCharacter(id){observeLocation(state.mapLocations[id],`${CHARS[id].name.split(' ')[0]} is at ${ISLAND_LOCATIONS[state.mapLocations[id]].name}. Their mood toward you is ${composite(state,id)>60?'warm':composite(state,id)<-60?'tense':'hard to read'}.`)}
function bindIslandMap(){

  renderMapAvatars(false);renderSocialFeed();observeLocation(state.observedLocation||'camp');
}

async function loadScene(isNewGame){
  const eventDef = getCurrentEventDef();
  document.getElementById('scene-eyebrow').textContent = `Day ${currentDayNumber()} · ${SLOT_LABEL[currentSlot()]}`;
  document.getElementById('scene-title').textContent = eventDef.title;
  const currentKey = SEQUENCE[state.seqIndex] || 'd1-morning';
  const visualKey = currentKey==='d2-evening' ? (state.flags.overheard_simone_julian ? 'd2-evening-secret' : 'd2-evening-karaoke') : currentKey;
  document.getElementById('scene-art-wrap').innerHTML = sceneVisual(visualKey);
  const mysteryWrap=document.getElementById('mystery-chips-wrap'); if(mysteryWrap) mysteryWrap.innerHTML = currentMysteryChips();
  const panelEl = document.getElementById('scene-panel');
  if(panelEl) panelEl.classList.toggle('eerie', currentDayNumber()>=2 || currentSlot()==='night');

  // Nudge involved characters toward a location that matches the current story beat.
  const sceneHome = ({morning:'camp',afternoon:'beach',evening:'firepit',night:'firepit'})[currentSlot()] || 'camp';
  if(eventDef.involved && eventDef.involved.length){
    const special = currentKey.includes('morning') && currentDayNumber()===1 ? 'wreckage'
      : eventDef.title.toLowerCase().includes('tide') ? 'tidepools'
      : eventDef.title.toLowerCase().includes('island') || eventDef.title.toLowerCase().includes('truth') ? (isRuinsUnlocked()?'ruins':'jungle')
      : eventDef.title.toLowerCase().includes('storm') ? 'camp'
      : sceneHome;
    eventDef.involved.forEach(id=>moveCharacter(id,special));
    renderMapAvatars(true); observeLocation(special);
  }

  const portraitRow = document.getElementById('portrait-row');
  const involvedForPortraits = isNewGame ? CHAR_ORDER : (eventDef.involved && eventDef.involved.length ? eventDef.involved : []);
  portraitRow.innerHTML = involvedForPortraits.map(id => portraitHTML(id, involvedForPortraits.length > 4 ? 44 : 68, true)).join('');

  const narrEl = document.getElementById('narration-text');
  narrEl.className = 'narration-text loading';
  narrEl.innerHTML = 'The island holds its breath<span class="dots"></span>';
  document.getElementById('dialogue-list').innerHTML = '';
  document.getElementById('choices-wrap').innerHTML = '';

  const scene = isNewGame
    ? await generateSceneText({beat:"You wake on warm sand with seven strangers and no memory of the final moments before the crash. The wreck smokes nearby. Farther up the beach, a trail of wet footprints leads from the ocean into the trees — too fresh to be old.", involved:['nia','malik','simone','julian','ama','priya','dez']}, "This is the opening scene. Make it immediately intriguing and faintly eerie without explaining the footprints.")
    : await generateSceneText(eventDef);

  if(!state) return;
  state._lastScene = scene;

  narrEl.className = 'narration-text';
  narrEl.textContent = scene.narration;

  if(currentDayNumber()===3 && currentSlot()==='afternoon') {
    narrEl.insertAdjacentHTML('afterend', `<div class="glitch-note">JOURNAL UPDATE // a sentence appears beneath your last entry in handwriting that is not yours: “EIGHT ARRIVED. NINE SHADOWS LEFT THE WATER.”</div>`);
    state.flags.journal_changed = true;
  }

  const dList = document.getElementById('dialogue-list');
  dList.innerHTML = scene.dialogue.map(d => `
    <div class="dialogue-row">
      ${portraitHTML(d.speaker, 36, false)}
      <div class="dialogue-bubble">
        <div class="dialogue-speaker">${CHARS[d.speaker].name.split(' ')[0]}</div>
        <div class="dialogue-line">${d.line}</div>
      </div>
    </div>
  `).join('');

  renderChoices(eventDef);
}

async function playFightChallenge(challengeKey){
  const challenge=STORY_CHALLENGES[challengeKey];
  if(!challenge || state.minigames.scores[challenge.id]!==undefined) return null;
  const originalGet=getStoryChallenge;
  // playMiniGame normally resolves by story key; temporarily route this bonus challenge directly.
  STORY_CHALLENGES.__bonus=challenge;
  const old=STORY_CHALLENGES.__bonus;
  const result=await (async()=>{
    const saved=STORY_CHALLENGES['__bonus'];
    return await playMiniGame('__bonus');
  })();
  delete STORY_CHALLENGES.__bonus;
  return result;
}

function applyFightOutcome(kind,result){
  if(!result) return;
  if(result.win){state.fights.won++;state.fights.stopped++;changeTension(-12);}
  else{state.fights.lost++;changeTension(18);applySurvival({food:-1,shelter:-1});}
  state.flags[kind+'_win']=!!result.win;
  if(kind==='camp_fight'){
    if(result.win) applyEffects({malik:{respect:8},priya:{respect:8}});
    else applyEffects({malik:{resentment:8},priya:{resentment:8},all:{fear:4}});
  }
  if(kind==='rival_fight' && state._d3target){
    applyEffects({[state._d3target]:result.win?{respect:10,resentment:8}:{respect:-5,resentment:12}});
  }
  if(kind==='final_fight' && result.win) applySurvival({signal:1});
}

  if(!result)return;
  if(key==='d1-morning'){state.flags.salvage_success=result.win;if(result.win){applySurvival({food:1,shelter:1});applyEffects({malik:{respect:8},nia:{trust:5}})}else applySurvival({food:-1})}
  if(key==='d1-afternoon'){state.flags.tidepool_played=true;if(result.win){state.flags.tidepool_clues=true;applySurvival({signal:1});applyEffects({ama:{trust:12,affection:8}})}}
  if(key==='d1-evening'){state.flags.first_shelter=result.win;applySurvival(result.win?{shelter:2}:{shelter:-1})}
  if(key==='d2-morning'){state.flags.water_success=result.win;if(result.win){applySurvival({water:2});applyEffects({all:{trust:4},nia:{affection:5}})}else applySurvival({water:-1})}
  if(key==='d2-evening'){state.flags.forage_success=result.win;applySurvival(result.win?{food:2}:{food:-1})}
  if(key==='d2-afternoon'){state.flags.route_success=result.win;if(result.win){applySurvival(state.flags.sided_priya?{shelter:1}:state.flags.sided_malik?{signal:1}:{shelter:1,signal:1});if(state.flags.sided_malik)applyEffects({malik:{trust:10,respect:8}});else if(state.flags.sided_priya)applyEffects({priya:{trust:10,respect:8}});else applyEffects({malik:{respect:6},priya:{respect:6}})}}
  if(key==='d2-night'){state.flags.plate_clues_found=result.win;if(result.win){if(state.flags.ama_has_plate)applyEffects({ama:{respect:8,trust:6}});else if(state.flags.kept_plate_secret)applyEffects({dez:{trust:8,loyalty:6}});else applyEffects({all:{respect:3}})}}

    const prepared=state.flags.route_success || state.survival.shelter>=3 || composite(state,'malik')>=35;
    if(!prepared){
      die('You never made it back from the wreckage.', 'You went alone as the storm hit without a safe route, strong shelter preparation, or enough trust for Malik to follow you. The wind tears loose part of the wreckage before you can reach camp.');
      return true;
    }
    showToast(state.flags.route_success?'Your earlier route work gets you back safely.':composite(state,'malik')>=35?'Malik refuses to let you go alone.':'The reinforced camp gives you a safe return point.');
  }
  if(choice.lethal==='lookout_alone'){
    const prepared=state.flags.shelter_held && state.survival.signal>=2;
    if(!prepared){
      die('The lookout collapses beneath you.', 'You left the signal team during bad conditions without a stable camp or strong signal already established. The wet ridge gives way before anyone realizes where you went.');
      return true;
    }
    showToast('Earlier preparation makes the lookout risk survivable.');
  }
  return false;
}

function postChallengeDeathCheck(storyKey, choice, result){
  if(choice.lethal==='ruins_alone'){
    const protectedByClues=state.flags.plate_clues_found || state.flags.tidepool_clues;
    if(!result?.win && !protectedByClues){
      die('The underground door seals behind you.', 'You entered alone without enough earlier clues and then failed the lock challenge. Nobody knows which passage you took, and the room goes dark.');
      return true;
    }
    if(result?.win) showToast('You survive the underground site because you solved the lock.');
    else if(protectedByClues) showToast('Your earlier clues reveal a second exit. You barely get out.');
  }
  return false;
}

function renderChoices(eventDef){
  const wrap = document.getElementById('choices-wrap');
  wrap.innerHTML = '';
  const letters = ['A','B','C'];
  eventDef.choices.forEach((choice, i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-letter">${letters[i]}</span><span>${choice.text}${choice.risk?`<span class="risk-tag">${choice.risk}</span>`:''}</span>`;
    btn.addEventListener('click', ()=> selectChoice(eventDef, choice));
    wrap.appendChild(btn);
  });
}

async function selectChoice(eventDef, choice){
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled = true);
  const storyKey=SEQUENCE[state.seqIndex];

  applyEffects(choice.effects);
  applySurvival(choice.survival);
  if(choice.tension) changeTension(choice.tension);
  if(choice.flags) Object.assign(state.flags, choice.flags);
  (choice.tag||[]).forEach(t=>{ if(state.tagCounts[t] !== undefined) state.tagCounts[t]++; });

  if(lethalChoiceCheck(storyKey, choice)) return;

  const scene = state._lastScene || {narration:eventDef.beat, dialogue:[]};
  const sceneSummary = [scene.narration, ...scene.dialogue.map(d=>`${CHARS[d.speaker].name.split(' ')[0]}: "${d.line}"`)].join(' ');
  state.journal.push({ day: currentDayNumber(), slot: currentSlot(), title: eventDef.title, scene: sceneSummary, choice: choice.text });

  const storyChallenge=getStoryChallenge(storyKey);
  if(storyChallenge){
    const result=await playMiniGame(storyKey);
    applyMiniGameOutcome(storyKey,result);
    if(postChallengeDeathCheck(storyKey, choice, result)) return;
    if(result) state.journal.push({day:currentDayNumber(),slot:currentSlot(),title:`Challenge: ${storyChallenge.title}`,scene:result.text,choice:result.win?'Completed':'Not completed'});
  }

  if(storyKey==='d2-afternoon'){
    const result=await playFightChallenge('fight-camp');
    applyFightOutcome('camp_fight',result);
    if(result) state.journal.push({day:currentDayNumber(),slot:currentSlot(),title:'Fight: Camp Showdown',scene:result.text,choice:result.win?'Fight stopped':'Fight got out of control'});
  }
  if(storyKey==='d3-afternoon' && !state.flags.promised_ama_exploration && (state.flags.stood_ground_rival || state.tension>=55)){
    const result=await playFightChallenge('fight-rival');
    applyFightOutcome('rival_fight',result);
    if(!result.win && state.tension>=85 && state.survival.shelter<=1){ die('The supply fight turns deadly.', 'Camp tension was already at the breaking point and your shelter was badly damaged. During the struggle you are knocked into broken wreckage before the others can stop it.'); return; }
    if(result) state.journal.push({day:currentDayNumber(),slot:currentSlot(),title:'Fight: Supply Crate Scuffle',scene:result.text,choice:result.win?'Held the line':'Lost supplies'});
  }
  if(storyKey==='d3-night' && state.tension>=55){
    const result=await playFightChallenge('fight-final');
    applyFightOutcome('final_fight',result);
    if(!result.win && state.tension>=85 && state.survival.signal<=1){ die('The beach fight costs the group its last chance.', 'With camp tension out of control and almost no signal prepared, the fight carries into the surf as the storm surges. You do not make it back to shore.'); return; }
    if(result) state.journal.push({day:currentDayNumber(),slot:currentSlot(),title:'Fight: Beach Brawl',scene:result.text,choice:result.win?'Camp held together':'Camp fractured'});
  }

  state.seqIndex++;
  renderCastPanelUpdate();

  if(state.seqIndex >= SEQUENCE.length){
    render();
    await runEnding();
  }else{
    renderGame();
    await loadScene(false);
  }
}

function renderCastPanelUpdate(){
  const panel = document.querySelector('.cast-panel');
  if(panel) panel.outerHTML = renderCastPanel();
  bindCastPanel();
}

/* ---------- Character modal ---------- */
function openCharModal(id){
  const c = CHARS[id];
  const s = state.stats[id];
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const statRows = STAT_KEYS.map(stat=>{
    const val = s[stat];
    const pct = Math.abs(val);
    const isNeg = NEGATIVE_STATS.includes(stat);
    const color = isNeg ? 'var(--coral)' : 'var(--lagoon)';
    return `
      <div class="stat-row">
        <div class="stat-label">${stat}</div>
        <div class="stat-track">
          <div class="stat-fill" style="width:${pct/2}%; background:${color}; ${val>=0?`left:50%;`:`right:50%;`}"></div>
        </div>
      </div>
    `;
  }).join('');
  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        ${portraitHTML(id,64,true)}
        <div>
          <div class="name">${c.name}</div>
          <div class="role">${c.role}</div>
        </div>
      </div>
      ${statRows}
      <div class="modal-trait">${c.trait}</div>
      <div class="modal-close-row"><button class="btn ghost" id="close-modal">Close</button></div>
    </div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('close-modal').addEventListener('click', ()=>backdrop.remove());
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
}

/* ---------- Journal ---------- */
function openJournal(){
  const backdrop = document.createElement('div');
  backdrop.className = 'journal-backdrop';
  const entries = state.journal.slice().reverse().map(e=>`
    <div class="journal-entry">
      <div class="jday">Day ${e.day} · ${SLOT_LABEL[e.slot]} · ${e.title}</div>
      <div class="jtext">${e.scene}</div>
      <div class="jchoice">→ ${e.choice}</div>
    </div>
  `).join('') || '<div class="jtext">Nothing written yet.</div>';
  backdrop.innerHTML = `
    <div class="journal-drawer">
      <h3 style="font-family:var(--serif); font-size:20px; margin-bottom:6px;">📓 Journal</h3>
      <div class="eyebrow" style="margin-bottom:14px;">Everything that's happened, most recent first</div>
      ${entries}
      <div style="margin-top:18px;"><button class="btn ghost" id="close-journal">Close</button></div>
    </div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('close-journal').addEventListener('click', ()=>backdrop.remove());
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
}

/* ---------- Ending ---------- */
function computeArchetype(){
  let best = 'diplomat', bestCount = -1;
  const order = ['leader','diplomat','strategist','protector','peacemaker','wildcard','loneWolf'];
  for(const key of order){
    if(state.tagCounts[key] > bestCount){ bestCount = state.tagCounts[key]; best = key; }
  }
  return best;
}
function closestAllyId(){
  let best=null,bestScore=-Infinity;
  for(const id of CHAR_ORDER){ const c=composite(state,id); if(c>bestScore){bestScore=c;best=id;} }
  return best;
}
function biggestRivalId(){
  let best=null,bestScore=Infinity;
  for(const id of CHAR_ORDER){ const c=composite(state,id); if(c<bestScore){bestScore=c;best=id;} }
  return best;
}

async function runEnding(){
  const archetypeKey = computeArchetype();
  const ally = closestAllyId();
  const rival = biggestRivalId();
  const el = document.getElementById('ending-text');
  if(el) el.innerHTML = 'The ship draws closer<span class="dots"></span>';
  const text = await generateEndingText(archetypeKey, ally, rival);
  const el2 = document.getElementById('ending-text');
  if(el2) el2.textContent = text;
}

function renderEnding(){
  stopSocialSim();
  const ally = closestAllyId();
  const rival = biggestRivalId();
  const survivalTotal=Object.values(state.survival||{}).reduce((a,b)=>a+b,0);
  const campResult=state.tension>=70?'Camp Fractured':state.tension>=45?'Barely Together':'Camp Held Together';
  const rescueResult=(state.flags.signal_fire_success && survivalTotal>=8)?'Direct rescue':survivalTotal<6?'Rescue delayed':'Rescue reached shore';
  app.innerHTML = `
    <div class="ending-screen">
      <div class="run-complete-badge">✓ Three-day survival run complete</div>
      <div class="eyebrow">RESCUE REACHED THE BEACH</div>
      <div class="ending-cast">${CHAR_ORDER.map(id=>portraitHTML(id,44,true)).join('')}</div>
      <div class="archetype-card">
        <div class="eyebrow">CAMP OUTCOME</div>
        <div class="archetype-name" style="font-size:34px">${campResult}</div>
        <div style="font-size:14px;line-height:1.7;color:var(--sand-dim)">This ending is based on the camp's survival condition, tension, fights, and rescue preparation — not a personality type.</div>
      </div>
      <div class="ending-summary" id="ending-text">Loading<span class="dots"></span></div>
      <div class="ending-grid">
        <div class="ending-stat">${portraitHTML(ally,36,false)}<div><div class="k">Still With You</div><div class="v">${CHARS[ally].name}</div></div></div>
        <div class="ending-stat">${portraitHTML(rival,36,false)}<div><div class="k">Biggest Rival</div><div class="v">${CHARS[rival].name}</div></div></div>
        <div class="ending-stat"><div><div class="k">Fights Controlled</div><div class="v">${state.fights.won}</div></div></div>
        <div class="ending-stat"><div><div class="k">Fights Lost</div><div class="v">${state.fights.lost}</div></div></div>
        <div class="ending-stat"><div><div class="k">Final Tension</div><div class="v">${state.tension}/100 · ${tensionLabel()}</div></div></div>
        <div class="ending-stat"><div><div class="k">Rescue</div><div class="v" style="font-size:13px">${rescueResult}</div></div></div>
      </div>
      <button class="btn" id="replay-btn" style="margin-top:10px;">Play Again</button>
    </div>
  `;
  document.getElementById('replay-btn').addEventListener('click', ()=>{
    state = initState();
    render();
  });
}

/* ============================= INIT ============================= */
state = initState();
render();
</script>
